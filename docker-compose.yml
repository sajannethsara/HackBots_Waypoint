# One command starts everything: database → API (migrate + seed on first boot) → web.
#   docker compose up --build
name: waypoint

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    # Local convenience: migrate + seed (no-op if already seeded), then serve. Production splits this out.
    command: ["sh", "-c", "cd /repo/packages/db && ./node_modules/.bin/prisma migrate deploy && node dist/seed/index.js && cd /repo/apps/api && node dist/main.js"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-waypoint}:${POSTGRES_PASSWORD:-waypoint}@db:5432/${POSTGRES_DB:-waypoint}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PING_SECONDS: ${DEMO_PING_SECONDS:-10}
      GPS_PING_SECONDS: ${GPS_PING_SECONDS:-240}
      ARRIVE_RADIUS_M: ${ARRIVE_RADIUS_M:-150}
      DATA_DIR: /repo/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
