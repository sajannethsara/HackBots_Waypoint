# Build the api + web images, push them to GHCR, then roll the EC2 box forward over SSH.
# Needs two repo secrets: EC2_HOST (Elastic IP) and EC2_SSH_KEY (contents of the .pem). See docs/DEPLOY.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/waypoint-api:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/waypoint-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/waypoint-web:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/waypoint-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.EC2_HOST }}
      SSH_USER: ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "Cannot reach $HOST:22 - check the EC2 security group allows SSH from GitHub runners" >&2; exit 1; }

      - name: Sync compose files
        run: scp -i ~/.ssh/deploy_key docker-compose.prod.yml Caddyfile "$SSH_USER@$HOST":/opt/waypoint/

      - name: Pull and restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$HOST" "GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/waypoint
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          set -a; . ./.env; set +a
          for i in $(seq 1 24); do
            if curl -fsS "https://$SITE_HOST/api/health"; then echo; echo "deploy ok"; exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=40
          echo "health check failed" >&2
          exit 1
          REMOTE
